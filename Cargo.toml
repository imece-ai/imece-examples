[workspace]
members = [
    "01-hello-embedding",
    "02-memory-chain",
    "03-semantic-search",
    "04-simple-inference",
    "05-rag-pipeline",
    "06-rollback-agent",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
imece_core = { path = "../imece-core" }
ndarray = "0.16"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
